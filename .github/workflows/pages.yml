# Builds the game, deploys it to GitHub Pages and then plays through the
# browser smoke test against the live site.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that every push to main redeploys, and the
# workflow can also be started by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling a deploy in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Browser smoke test on the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NN_URL: ${{ needs.deploy.outputs.page_url }}
      NN_OUT: e2e/out
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the smoke test
        run: npx playwright-core install --with-deps chromium
      - name: Wait until the new deployment is served
        run: |
          for i in $(seq 1 30); do
            if curl -sfL "$NN_URL" | grep -q 'Night Neighbour'; then exit 0; fi
            sleep 10
          done
          echo "Site did not come up at $NN_URL" && exit 1
      - name: Play through the game in headless Chromium (software rendering)
        run: node e2e/run-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: e2e/out
          if-no-files-found: ignore
